databases:
  - name: conspiracy-db
    plan: free
    databaseName: conspiracy_db
    user: conspiracy_user

services:
  - type: web
    name: conspiracy-mcp-1-all-tiers
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: MAX_TIER
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: conspiracy-db
          property: connectionString

  - type: web
    name: conspiracy-mcp-2-tier2-3
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: MAX_TIER
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: conspiracy-db
          property: connectionString

  - type: web
    name: conspiracy-mcp-3-tier3-only
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: MAX_TIER
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: conspiracy-db
          property: connectionString
